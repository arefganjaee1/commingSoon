<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قرضی — به زودی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
    --primary:#143648; --secondary:#f8edd5; --accent:#f4a261; --text:#1f2937; --muted:#6b7280;
}
html,body { min-height:100vh; font-family:'Vazirmatn',sans-serif; background:var(--secondary); color:var(--text); overflow-x:hidden; }
body::before,body::after { content:''; position:fixed; border-radius:50%; pointer-events:none; z-index:0; }
body::before { width:600px;height:600px; background:radial-gradient(circle,rgba(20,54,72,.07) 0%,transparent 70%); top:-200px;left:-200px; }
body::after  { width:500px;height:500px; background:radial-gradient(circle,rgba(244,162,97,.12) 0%,transparent 70%); bottom:-150px;right:-150px; }
.page { position:relative;z-index:1;min-height:100vh;display:grid;grid-template-columns:1fr 1fr; }
.left { display:flex;flex-direction:column;justify-content:center;padding:60px 56px 60px 40px; }
.logo-row { display:flex;align-items:center;gap:14px;margin-bottom:48px; }
.logo-icon { width:52px;height:52px;background:var(--primary);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px; }
.logo-text { font-size:28px;font-weight:900;color:var(--primary); }
.logo-text span { color:var(--accent); }
.tagline { font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:16px; }
.headline { font-size:48px;font-weight:900;line-height:1.2;color:var(--primary);margin-bottom:20px; }
.headline em { font-style:normal;color:var(--accent);position:relative; }
.headline em::after { content:'';position:absolute;bottom:4px;right:0;left:0;height:4px;background:var(--accent);border-radius:2px;opacity:.3; }
.subtext { font-size:16px;line-height:1.8;color:var(--muted);max-width:380px;margin-bottom:40px; }
.counter-row { display:flex;gap:24px;margin-bottom:48px; }
.counter-item { text-align:center; }
.counter-num { font-size:36px;font-weight:900;color:var(--primary);line-height:1;transition:.3s; }
.counter-label { font-size:11px;color:var(--muted);font-weight:600;margin-top:4px; }
.counter-divider { width:1px;background:rgba(20,54,72,.12);margin:4px 0; }
.right { display:flex;align-items:center;justify-content:center;padding:60px 40px 60px 56px;background:rgba(20,54,72,.03);border-right:1px solid rgba(20,54,72,.08); }
.form-card { width:100%;max-width:420px;background:white;border-radius:28px;padding:36px 32px;box-shadow:0 20px 60px rgba(20,54,72,.1); }
.form-title { font-size:20px;font-weight:800;color:var(--primary);margin-bottom:6px; }
.form-sub { font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6; }
.field { margin-bottom:16px; }
.field label { display:block;font-size:12px;font-weight:700;color:var(--primary);margin-bottom:7px; }
.field input,.field textarea { width:100%;padding:12px 16px;border:1.5px solid rgba(20,54,72,.12);border-radius:14px;font-family:inherit;font-size:14px;color:var(--text);background:#fafafa;transition:.2s;outline:none; }
.field input:focus,.field textarea:focus { border-color:var(--primary);background:white;box-shadow:0 0 0 3px rgba(20,54,72,.08); }
.field textarea { height:90px;resize:none;line-height:1.7; }
.submit-btn { width:100%;height:52px;background:var(--primary);color:white;border:none;border-radius:16px;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;transition:.25s;margin-top:8px; }
.submit-btn:hover { background:#0f2d44;transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,54,72,.25); }
.submit-btn:disabled { opacity:.6;cursor:default;transform:none; }
.success-msg { display:none;text-align:center;padding:20px 0;animation:fadeIn .4s ease; }
.success-msg .check { font-size:48px;margin-bottom:12px; }
.success-msg h3 { font-size:18px;font-weight:800;color:var(--primary);margin-bottom:8px; }
.success-msg p { font-size:13px;color:var(--muted);line-height:1.7; }
.registrations { margin-top:28px;padding-top:24px;border-top:1px solid rgba(20,54,72,.08); }
.reg-title { font-size:12px;font-weight:700;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px; }
.reg-list { display:flex;flex-direction:column;gap:8px;max-height:180px;overflow-y:auto; }
.reg-item { display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(20,54,72,.03);border-radius:12px;animation:slideIn .3s ease; }
.reg-avatar { width:32px;height:32px;border-radius:50%;background:var(--primary);color:white;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0; }
.reg-info { flex:1;min-width:0; }
.reg-name { font-size:13px;font-weight:700;color:var(--primary); }
.reg-msg { font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.reg-time { font-size:10px;color:var(--muted);flex-shrink:0;margin-top:2px; }
.footer { position:fixed;bottom:0;left:0;right:0;text-align:center;padding:14px;font-size:12px;color:var(--muted);z-index:1; }
.footer a { color:var(--accent);text-decoration:none;font-weight:600; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
.left > * { animation:fadeIn .5s ease both; }
.left > *:nth-child(1){animation-delay:.1s} .left > *:nth-child(2){animation-delay:.2s}
.left > *:nth-child(3){animation-delay:.3s} .left > *:nth-child(4){animation-delay:.35s}
.left > *:nth-child(5){animation-delay:.4s} .left > *:nth-child(6){animation-delay:.45s}
.form-card { animation:fadeIn .6s ease .2s both; }
@media(max-width:768px){
    .page{grid-template-columns:1fr}
    .left{padding:40px 24px 32px;order:1}
    .right{padding:0 24px 40px;border-right:none;border-top:1px solid rgba(20,54,72,.08);order:2;background:transparent}
    .headline{font-size:32px} .logo-row,.counter-row{margin-bottom:32px}
    .form-card{border-radius:24px;padding:28px 24px;box-shadow:0 10px 30px rgba(20,54,72,.08)}
    .footer{position:static;margin-top:20px;padding-bottom:24px}
}
</style>
</head>
<body>
<div class="page">
    <div class="left">
        <div class="logo-row">
            <img src="logo.svg" style="height:520px;width:auto;">
        </div>
        <p class="tagline">GHARZI.COM</p>
        <h1 class="headline">داریم<br><em>می‌آییم</em></h1>
        <p class="subtext">اولین پلتفرم قرض و اجاره کالا در ایران.<br>لازم داشتی قرض بگیر، نداشتی قرض بده</p>
        <div class="counter-row">
            <div class="counter-item">
                <div class="counter-num" id="cntUsers">0</div>
                <div class="counter-label">نفر منتظر</div>
            </div>
            <div class="counter-divider"></div>
            <div class="counter-item">
                <div class="counter-num" id="cntToday">0</div>
                <div class="counter-label">امروز ثبت‌نام</div>
            </div>
            <div class="counter-divider"></div>
            <div class="counter-item">
                <div class="counter-num" id="cntMsgs">0</div>
                <div class="counter-label">پیام دریافتی</div>
            </div>
        </div>
    </div>
    <div class="right">
        <div class="form-card">
            <div id="formSection">
                <h2 class="form-title">اول باش 🎯</h2>
                <p class="form-sub">اطلاعاتت رو بذار تا از اولین نفرا باشی که خبر دار میشی.</p>
                <div class="field">
                    <label>نام</label>
                    <input type="text" id="fName" placeholder="مثلاً: علی رضایی" maxlength="40">
                </div>
                <div class="field">
                    <label>شماره موبایل</label>
                    <input type="tel" id="fPhone" placeholder="09xxxxxxxxx" maxlength="11" dir="ltr">
                </div>
                <div class="field">
                    <label>پیام یا پیشنهاد (اختیاری)</label>
                    <textarea id="fMsg" placeholder="چی می‌خوای قرض بدی یا بگیری؟ هر چیزی..."></textarea>
                </div>
                <button class="submit-btn" id="submitBtn" onclick="submitForm()">ثبت می‌کنم ✓</button>
            </div>
            <div class="success-msg" id="successMsg">
                <div class="check">🎉</div>
                <h3>ثبت شدی!</h3>
                <p>به محض راه‌اندازی از همه چیز باخبرت می‌کنیم.<br>ممنون که اولی هستی 🙏</p>
            </div>
        </div>
    </div>
</div>


<script>
// ← آدرس Worker رو اینجا بذار بعد از ساخت
const WORKER_URL = "https://gharzi-api.aref-ganjaee1.workers.dev";

function timeAgo(d) {
    const s = Math.floor((Date.now()-new Date(d))/1000);
    if(s<60) return 'همین الان';
    if(s<3600) return Math.floor(s/60)+' دقیقه پیش';
    if(s<86400) return Math.floor(s/3600)+' ساعت پیش';
    return Math.floor(s/86400)+' روز پیش';
}
function initials(n){ const p=n.trim().split(' '); return p.length>1?p[0][0]+p[1][0]:p[0].slice(0,2); }
function maskPhone(p){ return p.length>=7?p.slice(0,4)+'****'+p.slice(-3):'***'; }
function shake(id){ const e=document.getElementById(id); e.style.borderColor='#D85A30'; e.style.animation='shake .4s ease'; setTimeout(()=>{e.style.borderColor='';e.style.animation='';},600); e.focus(); }
function animateNum(id,t){ const e=document.getElementById(id); const s=parseInt(e.textContent)||0; if(s===t)return; let i=0; const iv=setInterval(()=>{ i++; e.textContent=Math.round(s+(t-s)*(i/20)); if(i>=20)clearInterval(iv); },30); }

async function loadStats(){
    try{
        const r=await fetch(`${WORKER_URL}/stats`);
        const d=await r.json();
        animateNum('cntUsers',d.total);
        animateNum('cntToday',d.today);
        animateNum('cntMsgs',d.msgs);
    }catch(e){}
}

// لیست عمومی — فقط نام و زمان (بدون شماره کامل)
function renderList(list){
    const box=document.getElementById('regList');
    if(!list||!list.length){ box.innerHTML='<p style="font-size:12px;color:var(--muted);text-align:center;padding:8px 0;">هنوز کسی ثبت‌نام نکرده — اول باش!</p>'; return; }
    box.innerHTML=list.slice(0,8).map(r=>`
        <div class="reg-item">
            <div class="reg-avatar">${initials(r.name||'؟؟')}</div>
            <div class="reg-info">
                <div class="reg-name">${r.name||'کاربر'} <span style="font-size:10px;color:var(--muted);font-weight:400;">${maskPhone(r.phone||'')}</span></div>
                ${r.msg?`<div class="reg-msg">${r.msg}</div>`:''}
            </div>
            <div class="reg-time">${timeAgo(r.date)}</div>
        </div>`).join('');
}

async function loadList(){
    try{
        const r=await fetch(`${WORKER_URL}/stats`);
        // لیست عمومی نمیاد — فقط آمار. برای نمایش لیست یه endpoint جداگانه با داده‌های ماسک‌شده
        // فعلاً لیست رو خالی نگه می‌داریم تا شماره‌ها leak نشه
        renderList([]);
    }catch(e){}
}

async function submitForm(){
    const name=document.getElementById('fName').value.trim();
    const phone=document.getElementById('fPhone').value.trim();
    const msg=document.getElementById('fMsg').value.trim();
    if(!name){shake('fName');return;}
    if(!phone||!/^09\d{9}$/.test(phone)){shake('fPhone');return;}
    const btn=document.getElementById('submitBtn');
    btn.disabled=true; btn.textContent='در حال ثبت...';
    try{
        const r=await fetch(`${WORKER_URL}/register`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({name,phone,msg})
        });
        const d=await r.json();
        if(d.success){
            document.getElementById('formSection').style.display='none';
            document.getElementById('successMsg').style.display='block';
            loadStats();
        }else{
            alert(d.message);
            btn.disabled=false; btn.textContent='ثبت می‌کنم ✓';
        }
    }catch(e){
        alert('خطا در اتصال');
        btn.disabled=false; btn.textContent='ثبت می‌کنم ✓';
    }
}

loadStats();
setInterval(loadStats, 30000);
</script>
</body>
</html>
