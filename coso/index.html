<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>قرضی — به زودی</title>
<meta name="description" content="قرضی؛ اولین پلتفرم قرض و اجاره کالا در ایران. به‌زودی.">
<meta property="og:type" content="website">
<meta property="og:title" content="قرضی — به‌زودی">
<meta property="og:description" content="به‌جای خریدن، قرض بگیر. اولین پلتفرم قرض و اجاره کالا در ایران، به‌زودی.">
<meta property="og:image" content="https://gharzi.com/assets/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#143648">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#143648;
  --ink-soft:#3a5a70;
  --muted:#6b7280;
  --accent:#f4a261;
  --glass-bg:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.65);
  --glass-highlight:rgba(255,255,255,.85);
  --field-bg:rgba(255,255,255,.5);
  --field-border:rgba(20,54,72,.14);
}
html,body{height:100%;}
body{
  font-family:'Vazirmatn',sans-serif;
  min-height:100vh;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));
  position:relative;
  overflow:hidden;
  background:#f8edd5;
}
/* ===== لایه‌ی پس‌زمینه‌ی رنگی که شیشه ازش نور می‌گیره ===== */
.bg{ position:fixed; inset:0; z-index:0; overflow:hidden; }
.blob{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; }
.blob1{ width:520px;height:520px; background:radial-gradient(circle,#f4a261,transparent 70%); top:-140px; right:-120px; animation:drift1 26s ease-in-out infinite; }
.blob2{ width:600px;height:600px; background:radial-gradient(circle,#143648,transparent 70%); bottom:-200px; left:-160px; opacity:.5; animation:drift2 32s ease-in-out infinite; }
.blob3{ width:360px;height:360px; background:radial-gradient(circle,#E9C46A,transparent 70%); top:40%; left:50%; opacity:.35; animation:drift3 22s ease-in-out infinite; }
@keyframes drift1{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(-40px,30px); } }
@keyframes drift2{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(30px,-40px); } }
@keyframes drift3{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-46%,-54%) scale(1.08); } }

/* ===== کارت شیشه‌ای (Liquid Glass) ===== */
.wrap{ position:relative; z-index:1; width:100%; max-width:440px; }
.glass{
  position:relative;
  text-align:center;
  background:var(--glass-bg);
  -webkit-backdrop-filter:blur(38px) saturate(180%);
  backdrop-filter:blur(38px) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:32px;
  padding:44px 36px;
  box-shadow:0 24px 60px rgba(20,54,72,.18), inset 0 1px 0 var(--glass-highlight);
  overflow:hidden;
  animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
}
.glass::before{
  /* شیشه‌ی براق بالا — بازتاب نور */
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.45), rgba(255,255,255,0) 45%);
  pointer-events:none;
}
.glass::after{
  /* نور متحرکی که موقع hover دنبال موس میاد (فقط دسکتاپ) */
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(circle at var(--mx,50%) var(--my,0%), rgba(255,255,255,.4), transparent 55%);
  opacity:0; transition:opacity .35s ease;
  pointer-events:none;
}
.glass:hover::after{ opacity:1; }
@keyframes rise{ from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }

.app-icon{
  position:relative;
  width:72px;height:72px;margin:0 auto 18px;
  border-radius:20px;
  background:linear-gradient(160deg, rgba(255,255,255,.85), rgba(255,255,255,.45));
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 10px 24px rgba(20,54,72,.18), inset 0 1px 0 rgba(255,255,255,.8);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.app-icon img{ width:60%; height:60%; object-fit:contain; position:relative; z-index:1; }
.app-icon::after{
  content:'';
  position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.6), rgba(255,255,255,0) 50%);
  pointer-events:none;
}
.eyebrow{ position:relative; font-size:12px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:22px; }
h1{
  position:relative;
  font-size:38px;font-weight:800;line-height:1.2;letter-spacing:-1px;
  color:var(--ink); margin-bottom:14px;
}
h1 span{ color:var(--accent); }
.sub{ position:relative; font-size:15px;line-height:1.7;color:var(--muted);margin-bottom:32px; }

.field{ position:relative; margin-bottom:12px; }
input{
  width:100%; height:52px; padding:0 18px;
  background:var(--field-bg);
  border:1px solid var(--field-border);
  border-radius:18px;
  font-family:inherit; font-size:15px; color:var(--ink);
  outline:none; text-align:center;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  transition:border-color .2s ease, background .2s ease;
}
input:focus{ border-color:var(--ink); background:rgba(255,255,255,.8); }
input::placeholder{ color:rgba(20,54,72,.35); }

button{
  position:relative;
  width:100%; height:52px; margin-top:6px;
  border:none; border-radius:18px;
  background:linear-gradient(135deg, var(--ink), #1f4d68);
  color:#fff; font-family:inherit; font-size:15px; font-weight:700;
  cursor:pointer; transition:filter .2s ease, transform .15s ease;
  box-shadow:0 10px 24px rgba(20,54,72,.28), inset 0 1px 0 rgba(255,255,255,.25);
  display:flex; align-items:center; justify-content:center;
}
button:hover{ filter:brightness(1.08); }
button:active{ transform:scale(.98); }
button:disabled{ opacity:.5; cursor:default; }
.btn-spinner{
  display:none;
  width:18px;height:18px;
  border:2px solid rgba(255,255,255,.35);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}
button.loading .btn-text{ display:none; }
button.loading .btn-spinner{ display:inline-block; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.note{ position:relative; font-size:12px; color:var(--muted); margin-top:18px; line-height:1.7; }
.success{ display:none; position:relative; text-align:center; }
.success .ring{
  width:56px;height:56px;border-radius:50%;margin:0 auto 16px;
  background:rgba(255,255,255,.5); border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 1px 0 var(--glass-highlight);
}
.success h2{ font-size:21px;font-weight:700;color:var(--ink);margin-bottom:8px; }
.success p{ font-size:13px;color:var(--muted);line-height:1.7; }

@media(max-width:480px){
  .glass{ padding:36px 24px; border-radius:26px; }
  h1{ font-size:30px; }
}
/* ===== حالت تاریک — چون Liquid Glass واقعاً adaptive است ===== */
@media(prefers-color-scheme:dark){
  body{ background:#0b1620; color:#f1f5f9; }
  :root{
    --glass-bg:rgba(20,30,40,.45);
    --glass-border:rgba(255,255,255,.14);
    --glass-highlight:rgba(255,255,255,.18);
    --field-bg:rgba(255,255,255,.06);
    --field-border:rgba(255,255,255,.14);
    --ink:#f1f5f9;
    --ink-soft:#c9d3dc;
    --muted:#9aa5b1;
  }
  input::placeholder{ color:rgba(255,255,255,.35); }
}
/* ===== احترام به تنظیم «کاهش حرکت» گوشی/سیستم‌عامل ===== */
@media(prefers-reduced-motion:reduce){
  .blob{ animation:none; }
  .glass{ animation:none; }
  .btn-spinner{ animation:none; }
}
.error-msg{ display:none; position:relative; font-size:12px; color:#d64545; margin-top:14px; line-height:1.6; }
.waitlist-count{ display:none; position:relative; font-size:12px; color:var(--muted); margin-top:16px; }
.sr-only{ position:absolute; width:1px;height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
</style>
</head>
<body>
<div class="bg">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="blob blob3"></div>
</div>

<div class="wrap">
  <div class="glass">
    <div id="formView">
      <div class="app-icon"><img src="assets/icon-192.png" alt="قرضی"></div>
      <p class="eyebrow">قرضی</p>
      <h1>به‌جای خریدن،<br><span>قرض بگیر</span></h1>
      <p class="sub">به‌زودی. اول به تو خبر می‌دیم.</p>
      <form id="waitForm" onsubmit="event.preventDefault(); submitForm(); return false;">
        <div class="field">
          <label class="sr-only" for="fName">اسم</label>
          <input type="text" id="fName" placeholder="نام" autocomplete="name">
        </div>
        <div class="field">
          <label class="sr-only" for="fPhone">شماره موبایل</label>
          <input type="tel" id="fPhone" placeholder="شماره موبایل" maxlength="11" dir="ltr" autocomplete="tel">
        </div>
        <button type="submit" id="submitBtn">
          <span class="btn-text">خبرم کن</span>
          <span class="btn-spinner" aria-hidden="true"></span>
        </button>
        <p class="error-msg" id="errorMsg"></p>
        <p class="waitlist-count" id="waitlistCount"></p>
      </form>
          </div>
    <div class="success" id="successView">
      <div class="ring">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
      </div>
      <h2>تمام.</h2>
      <p>به‌محض راه‌اندازی خبرت می‌کنیم.</p>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://gharzi-api.aref-ganjaee1.workers.dev";
function shake(id){
  const e=document.getElementById(id);
  e.style.borderColor='#ff3b30';
  e.focus();
}
function showError(msg){
  const el=document.getElementById('errorMsg');
  if(!el) return;
  el.textContent=msg;
  el.style.display='block';
}
function hideError(){
  const el=document.getElementById('errorMsg');
  if(el) el.style.display='none';
}
async function submitForm(){
  hideError();
  const name=document.getElementById('fName').value.trim();
  const phone=document.getElementById('fPhone').value.trim();
  if(!name){ shake('fName'); return; }
  if(!phone||!/^09\d{9}$/.test(phone)){ shake('fPhone'); return; }
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.classList.add('loading');
  try{
    const r=await fetch(`${WORKER_URL}/register`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name, phone, msg:''})
    });
    const d=await r.json();
    if(d.success){
      document.getElementById('formView').style.display='none';
      document.getElementById('successView').style.display='block';
    }else{
      showError(d.message || 'مشکلی پیش اومد، دوباره امتحان کن.');
      btn.disabled=false; btn.classList.remove('loading');
    }
  }catch(e){
    showError('اتصال برقرار نشد. دوباره امتحان کن.');
    btn.disabled=false; btn.classList.remove('loading');
  }
}

async function loadWaitlistCount(){
  try{
    const r = await fetch(`${WORKER_URL}/stats`);
    const d = await r.json();
    const el = document.getElementById('waitlistCount');
    if(!el || !d || !d.total) return;
    el.textContent = `تا الان ${d.total.toLocaleString('fa-IR')} نفر منتظرن`;
    el.style.display = 'block';
  }catch(e){}
}
loadWaitlistCount();

// نور شیشه‌ای که موقع hover دنبال موس میاد — فقط رو دستگاه‌هایی که موس/hover واقعی دارن
(function(){
  const glassEl = document.querySelector('.glass');
  if(!glassEl) return;
  if(!window.matchMedia || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  glassEl.addEventListener('mousemove', function(e){
    const rect = glassEl.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    glassEl.style.setProperty('--mx', x + '%');
    glassEl.style.setProperty('--my', y + '%');
  });
})();
</script>
<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/service-worker.js');
  }
</script>
</body>
</html>
